<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lover's Deck · Vibes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vibes.css">
</head>
<body class="vibes-page">
  <div id="viewport">
    <div id="stage" class="vibes" data-boil="0">
      <div class="pink-sky"></div>
      <canvas id="hearts" width="1920" height="1080"></canvas>
      <div id="cupids"></div>
      <div class="weave vibes-weave"></div>
      <div class="vibes-grain"></div>
      <div class="vignette vibes-vignette"></div>
    </div>
  </div>

  <div id="start">
    <div class="start-card">
      <p class="start-title stitch-text"><span>Just vibes</span></p>
      <button id="startBtn" type="button">click to begin</button>
      <p class="start-hint typed-font">F full screen · M mute</p>
    </div>
  </div>
  <div id="soundHint" class="typed-font">click for sound</div>

  <script src="vendor/gsap.min.js"></script>
  <script src="js/music.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/vibes-sprites.js"></script>
  <script src="js/vibes.js"></script>
</body>
</html>

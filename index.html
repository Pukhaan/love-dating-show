<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lover's Deck</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pieces.css">
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <pattern id="satin-red" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
        <rect width="2.4" height="2.4" fill="#C3251D"/>
        <rect width="1.1" height="2.4" fill="#DE4236"/>
        <rect x="2.05" width="0.35" height="2.4" fill="#84150F"/>
      </pattern>
      <pattern id="satin-pink" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
        <rect width="2.4" height="2.4" fill="#EE9FB8"/>
        <rect width="1.1" height="2.4" fill="#F7BFD0"/>
        <rect x="2.05" width="0.35" height="2.4" fill="#C9708C"/>
      </pattern>
      <pattern id="satin-blue" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
        <rect width="2.4" height="2.4" fill="#2440A8"/>
        <rect width="1.1" height="2.4" fill="#3C5CC8"/>
        <rect x="2.05" width="0.35" height="2.4" fill="#152A75"/>
      </pattern>
    </defs>
  </svg>

  <div id="viewport">
    <div id="stage" data-boil="0">
      <div class="fabric"></div>
      <div class="weave"></div>
      <div id="ambient"></div>

      <div class="brand stitch-text"><span>The Lover's Deck</span></div>
      <div class="round typed-font">round <span id="roundNo">01</span></div>

      <div id="captions"></div>
      <div id="typed" class="typed"></div>

      <div id="deck"></div>
      <svg id="thread" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"></svg>
      <div id="arrow"></div>
      <div id="bigHeart"></div>
      <div id="burst"></div>

      <div id="envGroup">
        <div class="envelope">
          <div class="env-back"></div>
          <div class="env-heart"></div>
          <svg class="env-front" viewBox="0 0 560 360"></svg>
          <svg class="env-flap" viewBox="0 0 560 210"></svg>
        </div>
        <div id="seal" class="sprite"></div>
      </div>

      <div id="cupidBow" class="sprite"></div>
      <div id="cupidLetter" class="sprite"></div>
      <div class="vignette"></div>
    </div>
  </div>

  <div id="start">
    <div class="start-card">
      <p class="start-title stitch-text"><span>The Lover's Deck</span></p>
      <button id="startBtn" type="button">click to begin</button>
      <p class="start-hint typed-font">F full screen · M mute</p>
    </div>
  </div>
  <div id="soundHint" class="typed-font">click for sound</div>

  <script src="vendor/gsap.min.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/music.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
